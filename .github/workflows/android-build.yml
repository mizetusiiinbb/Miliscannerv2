name: Build Miliconfig IPv6 Scanner Pro APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.7

      - name: Setup Java 17
        uses: actions/setup-java@v4.2.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK Environment
        run: |
          echo "Configuring Android SDK environment..."
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          # Non-interactively accept Android SDK licenses
          mkdir -p "$ANDROID_HOME/licenses" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Validate Gradle Wrapper
        run: |
          echo "Validating Gradle wrapper files and configuration..."
          test -f gradle/wrapper/gradle-wrapper.properties || { echo "Error: gradle-wrapper.properties missing"; exit 1; }
          test -f gradle/wrapper/gradle-wrapper.jar || { echo "Error: gradle-wrapper.jar missing"; exit 1; }
          test -f gradlew || { echo "Error: gradlew missing"; exit 1; }
          chmod +x gradlew
          echo "Gradle wrapper validation passed."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3.3.2
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK Output
        run: |
          echo "Verifying debug APK build output..."
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/debug/app-debug.apk || { echo "Fatal: app-debug.apk not found"; exit 1; }

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4.3.3
        with:
          name: Miliconfig-IPv6-Scanner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4.3.3
        with:
          name: Unit-Test-Reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
